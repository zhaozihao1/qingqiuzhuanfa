# ============================================================
# Agent Proxy 配置文件
# 复制为 config.yaml 后修改
# ============================================================

# 代理端口：agent 请求发到这里，会被转发到当前生效的 target
proxy:
  host: 0.0.0.0
  port: 8080
  https:
    enabled: false
    cert: /etc/letsencrypt/live/your-domain.com/fullchain.pem
    key: /etc/letsencrypt/live/your-domain.com/privkey.pem

# 管理端口：手机浏览器打开这个端口的页面进行配置
admin:
  host: 0.0.0.0
  port: 8081
  username: admin
  password: CHANGE_ME_PLEASE
  https:
    enabled: false
    cert: /etc/letsencrypt/live/your-domain.com/fullchain.pem
    key: /etc/letsencrypt/live/your-domain.com/privkey.pem

# SQLite 数据库路径（存 targets、设置、请求日志）
db_path: data/proxy.db

# 单条请求/响应 body 最大记录字节数，超过则截断（不影响转发，只影响日志存储）
max_body_log_size: 10485760

# 代理转发超时（秒），agent 流式响应可能较长，按需调大
proxy_timeout: 300
