services:
  agent-relay:
    image: qingqiuzhuanfa:local
    build: .
    container_name: agent-relay
    restart: unless-stopped
    init: true
    ports:
      - "${RELAY_PORT:-8081}:8081"
      - "${ADMIN_PORT:-8082}:8082"
    environment:
      RELAY_PORT: "8081"
      ADMIN_PORT: "8082"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      RELAY_UPDATE_COMMAND: "${RELAY_UPDATE_COMMAND:-git -C /host-project pull --ff-only https://github.com/zhaozihao1/qingqiuzhuanfa.git main && docker compose -f /host-project/docker-compose.yml up -d --build}"
    volumes:
      - agent-relay-data:/data
      - /opt/agent-relay:/host-project
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true
    user: "0:0"

volumes:
  agent-relay-data:
