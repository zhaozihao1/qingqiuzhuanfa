<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Agent Proxy 管理面板</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .tab-active { background: #2563eb; color: white; }
  .tab-inactive { background: #e5e7eb; color: #374151; }
  pre { white-space: pre-wrap; word-break: break-all; }
  .modal-enter { animation: fadeIn .15s ease; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(10px);} to {opacity:1; transform:translateY(0);} }
</style>
</head>
<body class="bg-gray-100 min-h-screen pb-20">

<!-- 登录页 -->
<div id="loginPage" class="min-h-screen flex items-center justify-center p-4 hidden">
  <div class="bg-white rounded-2xl shadow-lg p-6 w-full max-w-sm">
    <h1 class="text-xl font-bold text-center mb-1">Agent Proxy</h1>
    <p class="text-gray-500 text-center text-sm mb-6">管理面板登录</p>
    <div class="space-y-3">
      <input id="loginUser" type="text" placeholder="用户名" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      <input id="loginPass" type="password" placeholder="密码" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      <button onclick="doLogin()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-medium active:bg-blue-700">登录</button>
    </div>
  </div>
</div>

<!-- 主界面 -->
<div id="mainApp" class="hidden">
  <!-- 顶部栏 -->
  <header class="bg-white shadow-sm sticky top-0 z-30">
    <div class="flex items-center justify-between px-4 py-3">
      <h1 class="text-lg font-bold text-gray-800">Agent Proxy</h1>
      <button onclick="logout()" class="text-sm text-gray-500 px-3 py-1 rounded-lg active:bg-gray-100">退出</button>
    </div>
    <!-- Tab 切换 -->
    <div class="flex px-4 pb-3 gap-2">
      <button id="tabTargets" onclick="switchTab('targets')" class="flex-1 py-2 rounded-lg text-sm font-medium tab-active">目标</button>
      <button id="tabLogs" onclick="switchTab('logs')" class="flex-1 py-2 rounded-lg text-sm font-medium tab-inactive">日志</button>
      <button id="tabSettings" onclick="switchTab('settings')" class="flex-1 py-2 rounded-lg text-sm font-medium tab-inactive">设置</button>
    </div>
  </header>

  <!-- 目标管理 -->
  <section id="panelTargets" class="p-4 space-y-3">
    <div class="bg-white rounded-xl p-4 shadow-sm">
      <h2 class="font-semibold text-gray-700 mb-3">添加目标 BaseURL</h2>
      <div class="space-y-2">
        <input id="newName" type="text" placeholder="名称（如 OpenAI）" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input id="newUrl" type="text" placeholder="https://api.openai.com" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button onclick="addTarget()" class="w-full bg-blue-600 text-white py-2 rounded-lg text-sm font-medium active:bg-blue-700">添加</button>
      </div>
    </div>
    <div id="targetList" class="space-y-2"></div>
  </section>

  <!-- 日志 -->
  <section id="panelLogs" class="p-4 space-y-3 hidden">
    <div class="bg-white rounded-xl p-3 shadow-sm flex items-center gap-2">
      <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
        <input type="checkbox" id="failedOnly" onchange="loadLogs(1)" class="w-4 h-4 accent-blue-600">
        仅看失败
      </label>
      <button onclick="loadLogs(currentPage)" class="ml-auto text-sm text-blue-600 active:opacity-60">刷新</button>
    </div>
    <div id="logList" class="space-y-2"></div>
    <div class="flex items-center justify-between px-1 pt-2">
      <button onclick="loadLogs(currentPage-1)" id="prevBtn" class="px-4 py-2 bg-white rounded-lg text-sm shadow-sm active:bg-gray-50 disabled:opacity-40">上一页</button>
      <span id="pageInfo" class="text-sm text-gray-500"></span>
      <button onclick="loadLogs(currentPage+1)" id="nextBtn" class="px-4 py-2 bg-white rounded-lg text-sm shadow-sm active:bg-gray-50 disabled:opacity-40">下一页</button>
    </div>
  </section>

  <!-- 设置 -->
  <section id="panelSettings" class="p-4 space-y-3 hidden">
    <div class="bg-white rounded-xl p-4 shadow-sm">
      <h2 class="font-semibold text-gray-700 mb-3">日志保留</h2>
      <div class="flex items-center gap-2">
        <input id="retentionDays" type="number" min="1" class="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <span class="text-sm text-gray-500">天</span>
        <button onclick="saveRetention()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium active:bg-blue-700">保存</button>
      </div>
      <p class="text-xs text-gray-400 mt-2">超过保留天数的请求日志会被自动清理（每小时执行一次）。</p>
    </div>
    <div class="bg-white rounded-xl p-4 shadow-sm">
      <h2 class="font-semibold text-gray-700 mb-3">手动清理</h2>
      <button onclick="manualCleanup()" class="w-full px-4 py-2 bg-red-50 text-red-600 rounded-lg text-sm font-medium active:bg-red-100">立即清理过期日志</button>
    </div>
    <div class="bg-white rounded-xl p-4 shadow-sm">
      <h2 class="font-semibold text-gray-700 mb-2">使用说明</h2>
      <ul class="text-xs text-gray-500 space-y-1 list-disc pl-4">
        <li>代理端口接收所有路径，原样拼接到当前生效目标后面。</li>
        <li>请求头/请求体除必改项（host、逐跳头）外原样转发。</li>
        <li>支持 SSE 流式输出，响应会逐块转发。</li>
        <li>所有请求和响应内容会被记录，可在日志页查看。</li>
      </ul>
    </div>
  </section>
</div>

<!-- 请求详情弹窗 -->
<div id="detailModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
  <div class="bg-white w-full sm:max-w-2xl max-h-[90vh] rounded-t-2xl sm:rounded-2xl overflow-hidden flex flex-col modal-enter">
    <div class="flex items-center justify-between px-4 py-3 border-b">
      <h3 class="font-semibold text-gray-800">请求详情</h3>
      <button onclick="closeDetail()" class="text-gray-400 text-2xl leading-none active:opacity-50">&times;</button>
    </div>
    <div id="detailBody" class="flex-1 overflow-y-auto p-4 space-y-4 text-sm"></div>
  </div>
</div>

<script>
let authHeader = null;
let currentPage = 1;
let currentTab = 'targets';

// ---- 认证 ----
function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  if (!u || !p) { alert('请输入用户名和密码'); return; }
  authHeader = 'Basic ' + btoa(u + ':' + p);
  sessionStorage.setItem('ap_auth', authHeader);
  enterApp();
}

function logout() {
  sessionStorage.removeItem('ap_auth');
  authHeader = null;
  document.getElementById('mainApp').classList.add('hidden');
  document.getElementById('loginPage').classList.remove('hidden');
}

function enterApp() {
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  switchTab('targets');
}

// ---- API ----
async function api(path, opts = {}) {
  const headers = opts.headers || {};
  headers['Authorization'] = authHeader;
  if (opts.body && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
  const res = await fetch(path, { ...opts, headers });
  if (res.status === 401) { logout(); throw new Error('未授权'); }
  if (!res.ok) {
    let msg = res.statusText;
    try { const j = await res.json(); msg = j.detail || JSON.stringify(j); } catch(e) {}
    throw new Error(msg);
  }
  const ct = res.headers.get('content-type') || '';
  return ct.includes('json') ? res.json() : res.text();
}

// ---- Tab ----
function switchTab(tab) {
  currentTab = tab;
  ['targets','logs','settings'].forEach(t => {
    document.getElementById('panel'+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle('hidden', t !== tab);
    const btn = document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1));
    btn.className = 'flex-1 py-2 rounded-lg text-sm font-medium ' + (t === tab ? 'tab-active' : 'tab-inactive');
  });
  if (tab === 'targets') loadTargets();
  if (tab === 'logs') loadLogs(1);
  if (tab === 'settings') loadRetention();
}

// ---- Targets ----
async function loadTargets() {
  try {
    const data = await api('/api/targets');
    const list = document.getElementById('targetList');
    if (!data.targets.length) {
      list.innerHTML = '<div class="text-center text-gray-400 text-sm py-8">暂无目标，添加一个吧</div>';
      return;
    }
    list.innerHTML = data.targets.map(t => `
      <div class="bg-white rounded-xl p-4 shadow-sm ${t.enabled ? 'ring-2 ring-green-500' : ''}">
        <div class="flex items-start justify-between gap-2">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2">
              <span class="font-semibold text-gray-800">${esc(t.name)}</span>
              ${t.enabled ? '<span class="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full">生效中</span>' : ''}
            </div>
            <div class="text-xs text-gray-500 mt-1 break-all">${esc(t.url)}</div>
          </div>
        </div>
        <div class="flex gap-2 mt-3">
          ${t.enabled
            ? '<button disabled class="flex-1 py-1.5 bg-gray-100 text-gray-400 rounded-lg text-xs">当前生效</button>'
            : `<button onclick="activateTarget(${t.id})" class="flex-1 py-1.5 bg-green-50 text-green-600 rounded-lg text-xs active:bg-green-100">切换生效</button>`}
          <button onclick="editTarget(${t.id}, '${esc(t.name)}', '${esc(t.url)}')" class="px-3 py-1.5 bg-blue-50 text-blue-600 rounded-lg text-xs active:bg-blue-100">编辑</button>
          <button onclick="deleteTarget(${t.id})" class="px-3 py-1.5 bg-red-50 text-red-600 rounded-lg text-xs active:bg-red-100">删除</button>
        </div>
      </div>
    `).join('');
  } catch(e) { alert('加载失败: ' + e.message); }
}

async function addTarget() {
  const name = document.getElementById('newName').value.trim();
  const url = document.getElementById('newUrl').value.trim();
  if (!name || !url) { alert('请填写名称和URL'); return; }
  try {
    await api('/api/targets', { method:'POST', body: JSON.stringify({name, url}) });
    document.getElementById('newName').value = '';
    document.getElementById('newUrl').value = '';
    loadTargets();
  } catch(e) { alert('添加失败: ' + e.message); }
}

async function activateTarget(id) {
  try { await api('/api/targets/'+id+'/activate', {method:'POST'}); loadTargets(); }
  catch(e) { alert('切换失败: ' + e.message); }
}

async function deleteTarget(id) {
  if (!confirm('确定删除该目标？')) return;
  try { await api('/api/targets/'+id, {method:'DELETE'}); loadTargets(); }
  catch(e) { alert('删除失败: ' + e.message); }
}

function editTarget(id, name, url) {
  const newName = prompt('名称', name);
  if (newName === null) return;
  const newUrl = prompt('BaseURL', url);
  if (newUrl === null) return;
  api('/api/targets/'+id, {method:'PUT', body: JSON.stringify({name:newName.trim(), url:newUrl.trim()})})
    .then(loadTargets).catch(e => alert('修改失败: ' + e.message));
}

// ---- Logs ----
async function loadLogs(page) {
  if (page < 1) page = 1;
  currentPage = page;
  const failedOnly = document.getElementById('failedOnly').checked;
  const size = 20;
  try {
    const data = await api(`/api/requests?page=${page}&size=${size}&failed_only=${failedOnly}`);
    const list = document.getElementById('logList');
    if (!data.items.length) {
      list.innerHTML = '<div class="text-center text-gray-400 text-sm py-8">暂无日志</div>';
    } else {
      list.innerHTML = data.items.map(r => {
        const ok = r.response_status && r.response_status < 400 && !r.error;
        const statusColor = ok ? 'bg-green-100 text-green-700' : (r.response_status ? 'bg-red-100 text-red-700' : 'bg-gray-100 text-gray-600');
        return `
        <div onclick="showDetail(${r.id})" class="bg-white rounded-xl p-3 shadow-sm active:bg-gray-50 cursor-pointer">
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 min-w-0">
              <span class="text-xs font-mono font-semibold text-gray-600">${esc(r.method)}</span>
              <span class="text-xs ${statusColor} px-1.5 py-0.5 rounded">${r.response_status || 'ERR'}</span>
            </div>
            <span class="text-xs text-gray-400 flex-shrink-0">${r.duration_ms ? r.duration_ms.toFixed(0)+'ms' : '-'}</span>
          </div>
          <div class="text-xs text-gray-700 mt-1 truncate">${esc(r.path)}</div>
          <div class="text-xs text-gray-400 mt-0.5">${fmtTime(r.timestamp)}</div>
          ${r.error ? `<div class="text-xs text-red-500 mt-1 truncate">${esc(r.error)}</div>` : ''}
        </div>`;
      }).join('');
    }
    const totalPages = Math.max(1, Math.ceil(data.total / size));
    document.getElementById('pageInfo').textContent = `${page} / ${totalPages} (共${data.total}条)`;
    document.getElementById('prevBtn').disabled = page <= 1;
    document.getElementById('nextBtn').disabled = page >= totalPages;
  } catch(e) { alert('加载失败: ' + e.message); }
}

async function showDetail(id) {
  try {
    const r = await api('/api/requests/'+id);
    const reqBody = decodeB64(r.request_body);
    const respBody = decodeB64(r.response_body);
    const ok = r.response_status && r.response_status < 400 && !r.error;
    document.getElementById('detailBody').innerHTML = `
      <div class="flex items-center gap-2 flex-wrap">
        <span class="font-mono font-semibold text-gray-700">${esc(r.method)}</span>
        <span class="text-xs ${ok?'bg-green-100 text-green-700':'bg-red-100 text-red-700'} px-2 py-0.5 rounded">${r.response_status || 'ERR'}</span>
        <span class="text-xs text-gray-400">${r.duration_ms ? r.duration_ms.toFixed(1)+'ms' : '-'}</span>
      </div>
      <div>
        <div class="text-xs text-gray-400 mb-1">时间</div>
        <div class="text-sm">${fmtTime(r.timestamp)}</div>
      </div>
      <div>
        <div class="text-xs text-gray-400 mb-1">目标</div>
        <div class="text-sm break-all">${esc(r.target_url || '-')}</div>
      </div>
      <div>
        <div class="text-xs text-gray-400 mb-1">路径</div>
        <div class="text-sm break-all font-mono">${esc(r.path)}${r.query?'?'+esc(r.query):''}</div>
      </div>
      ${r.error ? `<div><div class="text-xs text-gray-400 mb-1">错误</div><div class="text-sm text-red-600 break-all">${esc(r.error)}</div></div>` : ''}
      <div>
        <div class="text-xs text-gray-400 mb-1">请求头</div>
        <pre class="bg-gray-50 rounded-lg p-2 text-xs">${esc(formatHeaders(r.request_headers))}</pre>
      </div>
      <div>
        <div class="text-xs text-gray-400 mb-1">请求体</div>
        <pre class="bg-gray-50 rounded-lg p-2 text-xs max-h-48 overflow-y-auto">${esc(reqBody) || '<span class="text-gray-400">(空)</span>'}</pre>
      </div>
      <div>
        <div class="text-xs text-gray-400 mb-1">响应头</div>
        <pre class="bg-gray-50 rounded-lg p-2 text-xs">${esc(formatHeaders(r.response_headers))}</pre>
      </div>
      <div>
        <div class="text-xs text-gray-400 mb-1">响应体</div>
        <pre class="bg-gray-50 rounded-lg p-2 text-xs max-h-64 overflow-y-auto">${esc(respBody) || '<span class="text-gray-400">(空)</span>'}</pre>
      </div>
    `;
    document.getElementById('detailModal').classList.remove('hidden');
  } catch(e) { alert('加载详情失败: ' + e.message); }
}

function closeDetail() { document.getElementById('detailModal').classList.add('hidden'); }

// ---- Settings ----
async function loadRetention() {
  try {
    const data = await api('/api/retention');
    document.getElementById('retentionDays').value = data.days;
  } catch(e) { alert('加载失败: ' + e.message); }
}

async function saveRetention() {
  const days = parseInt(document.getElementById('retentionDays').value);
  if (!days || days < 1) { alert('请输入有效的天数'); return; }
  try {
    await api('/api/retention', {method:'PUT', body: JSON.stringify({days})});
    alert('保存成功');
  } catch(e) { alert('保存失败: ' + e.message); }
}

async function manualCleanup() {
  if (!confirm('立即清理所有超过保留天数的日志？')) return;
  try {
    const r = await api('/api/cleanup', {method:'POST'});
    alert('已清理 ' + r.deleted + ' 条');
  } catch(e) { alert('清理失败: ' + e.message); }
}

// ---- utils ----
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtTime(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleString('zh-CN', {hour12:false});
  } catch(e) { return iso; }
}
function decodeB64(s) {
  if (!s) return '';
  try {
    const bin = atob(s);
    const bytes = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    return new TextDecoder('utf-8', {fatal:false}).decode(bytes);
  } catch(e) { return '[二进制数据，无法显示]'; }
}
function formatHeaders(h) {
  if (!h) return '';
  if (typeof h === 'string') return h;
  return Object.entries(h).map(([k,v]) => k + ': ' + v).join('\n');
}

// ---- init ----
(function init(){
  const saved = sessionStorage.getItem('ap_auth');
  if (saved) { authHeader = saved; enterApp(); }
  else { document.getElementById('loginPage').classList.remove('hidden'); }
})();
</script>
</body>
</html>
