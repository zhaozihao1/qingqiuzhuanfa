[project]
name = "agent-relay"
version = "1.0.0"
description = "Streaming HTTP/HTTPS reverse proxy for AI agents with an audit dashboard"
requires-python = ">=3.11"
dependencies = ["aiohttp==3.12.15"]

[project.scripts]
agent-relay = "agent_relay.app:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
